# /etc/nginx/sites-available/rentaride  (symlink into sites-enabled)
# TLS certificates from certbot: sudo certbot --nginx -d rentaride.ng -d www.rentaride.ng

upstream rentaride_app {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  server_name rentaride.ng www.rentaride.ng;
  return 301 https://rentaride.ng$request_uri;
}

server {
  listen 443 ssl http2;
  server_name rentaride.ng www.rentaride.ng;
  # ssl_certificate and ssl_certificate_key are added by certbot.

  # Uploads are up to 10 MB.
  client_max_body_size 12m;
  # Don't advertise the nginx version.
  server_tokens off;

  # Baseline browser protections. A CSP is left to Next's nonce handling.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    proxy_pass http://rentaride_app;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Next.js uses Host / X-Forwarded-Host for Server Action CSRF checks.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Real client IP for rate limits (first hop only; don't trust client values).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    # Streaming (Suspense, partial prerendering) needs buffering off.
    proxy_buffering off;
    proxy_read_timeout 60s;
  }

  # Hashed build assets never change.
  location /_next/static/ {
    proxy_pass http://rentaride_app;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
